arazzo: 1.0.0
info:
  title: Ecommerce - Apply Coupons
  version: 1.0.0
  description: >-
    Illustrates a workflow whereby a client a) finds a product in the store, 
    b) finds coupons for that product, and finally
    c) orders the product while applying the coupons from step b.
sourceDescriptions:
  - name: ecom-api
    url: http://localhost:8002/docs/api.json
    type: openapi
workflows:
  - workflowId: apply-coupon
    summary: Apply a coupon to a product order.
    description: >-
      This is how you can find a product, find an applicable coupon, and apply that coupon in your order.
      The workflow concludes by outputting the ID of the placed order.
    inputs:
      $ref: "#/components/inputs/apply_coupon_input"
    steps:
      - stepId: find-product
        description: Find a product based on the provided category.
        operationId: ecom-api.findProductsByCategory
        parameters:
          - name: category
            in: query
            value: $inputs.my_product_category
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          my_product_id: $response.body#/0/id
      - stepId: find-coupons
        description: Find a coupon available for the selected product.
        operationId: ecom-api.getProductCoupons
        parameters:
          - name: productId
            in: path
            value: $steps.find-product.outputs.my_product_id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          my_coupon_code: $response.body#/0/code
      - stepId: place-order
        description: Place an order for the product, applying the coupon.
        workflowId: place-order
        parameters:
          - name: product_id
            value: $steps.find-product.outputs.my_product_id
          - name: coupon_code
            value: $steps.find-coupons.outputs.my_coupon_code
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          my_order_id: $outputs.workflow_order_id
    outputs:
      apply_coupon_order_id: $steps.place-order.outputs.my_order_id
  - workflowId: buy-available-product
    summary: Buy an available product if one is available.
    description:
      This workflow demonstrates a workflow very similar to `apply-coupon`, by intention.
      It's meant to indicate how to reuse a step (`place-order`) as well as a parameter (`page`, `pageSize`).
    inputs:
      $ref: "#/components/inputs/buy_available_product_input"
    steps:
      - stepId: find-product
        description: Find a product that is available for purchase.
        operationId: ecom-api.findProductsByStatus
        parameters:
          - name: status
            in: query
            value: "in-stock"
          - name: page
            in: query
            value: 1
          - name: pageSize
            in: query
            value: 10
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          my_product_id: $response.body#/0/id
      - stepId: place-order
        description: Place an order for the product.
        workflowId: place-order
        parameters:
          - name: product_id
            value: $steps.find-product.outputs.my_product_id
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          my_order_id: $outputs.workflow_order_id
    outputs:
      buy_product_order_id: $steps.place-order.outputs.my_order_id
  - workflowId: place-order
    summary: Place an order for a product.
    description:
      This workflow places an order for a product. It may be reused by other workflows as the "final step" in a purchase.
    inputs:
      type: object
      properties:
        product_id:
          type: integer
          format: int64
          description: The ID of the product to place in the order.
        quantity:
          type: integer
          format: int32
          description: The number of products to place in the order.
        coupon_code:
          type: string
          description: The coupon code to apply to the order.
    steps:
      - stepId: place-order
        description: Place an order for the product.
        operationId: ecom-api.checkout
        requestBody:
          contentType: application/json
          payload: {}
          replacements:
            - target: /cart_id
              value: "{$inputs.product_id}"
            - target: /payment_method
              value: "{$inputs.coupon_code}"
        successCriteria:
          - condition: $statusCode == 200
        outputs:
          step_order_id: $response.body#/order_id
    outputs:
      workflow_order_id: $steps.place-order.outputs.step_order_id
components:
  inputs:
    apply_coupon_input:
      type: object
      properties:
        my_product_category:
          type: string
          description: Desired category to use when searching for a product, e.g. "electronics"
        store_id:
          $ref: "#/components/inputs/store_id"
    buy_available_product_input:
      type: object
      properties:
        store_id:
          $ref: "#/components/inputs/store_id"
    store_id:
      type: string
      description: Indicates the domain name of the store where the customer is browsing or buying products, e.g. "store.example.com".
  parameters:
    page:
      name: page
      in: query
      value: 1
    pageSize:
      name: pageSize
      in: query
      value: 100
