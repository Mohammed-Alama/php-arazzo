arazzo: "1.0.1"
info:
  title: Inputs schema demo
  version: "1.0"
sourceDescriptions:
  - name: api
    url: https://conformance.invalid/api.json
    type: openapi
workflows:
  - workflowId: bookRide
    inputs:
      type: object
      required: [rideId]
      properties:
        rideId:
          type: integer
        rider:
          type: string
    steps:
      - stepId: fetchRide
        operationPath: "{$sourceDescriptions.api.url}#/paths/~1rides~1{rideId}/get"
        parameters:
          - name: rideId
            in: path
            value: "$inputs.rideId"
        successCriteria:
          - condition: "${response.statusCode} == 200"
