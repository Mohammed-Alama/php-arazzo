arazzo: "1.0.0"
info:
  title: Full
  version: "1.0"
  description: Exhaustive fixture
sourceDescriptions:
  - name: api
    url: http://localhost:8002/docs/api.json
    type: openapi
workflows:
  - workflowId: main
    summary: Primary workflow
    dependsOn:
      - init
    inputs:
      type: object
      properties:
        userId:
          type: string
    parameters:
      - name: X-Trace
        in: header
        value: "{$inputs.userId}"
    successActions:
      - name: wfGoEnd
        type: end
    failureActions:
      - reference: $components.failureActions.globalFail
    steps:
      - stepId: fetch
        description: Fetch user
        operationId: getUser
        operationPath: /users/{id}
        parameters:
          - name: id
            in: query
            value: "{$inputs.userId}"
        successCriteria:
          - condition: "$statusCode == 200"
            type: simple
            context: $response.header.status
        outputs:
          user: "{$response.body}"
        onSuccess:
          - reference: $components.successActions.goEnd
        onFailure:
          - name: back
            type: retry
            retryAfter: 500
            retryLimit: 2
      - stepId: post
        operationId: postThing
        requestBody:
          contentType: application/json
          payload: "{$steps.fetch.outputs.user}"
          replacements:
            - target: /id
              value: "{$inputs.userId}"
    outputs:
      user: "{$steps.fetch.outputs.user}"
components:
  parameters:
    Trace:
      name: X-Trace
      in: header
      value: "{$inputs.userId}"
  successActions:
    goEnd:
      name: goEnd
      type: end
  failureActions:
    globalFail:
      name: globalFail
      type: end
x-vendor-custom: hello
