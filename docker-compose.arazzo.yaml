version: "3.8"

services:
  petstore:
    image: swaggerapi/petstore3:1.0.28
    ports:
      - "8080:8080"
    environment:
      SWAGGER_HOST: 0.0.0.0
      SWAGGER_PORT: 8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v3/pets"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arazzo-net

networks:
  arazzo-net:
    driver: bridge
