# Issue-intake schema — the single source of truth (spec D9), version 2.
#
# Every section carries a `checks:` map of finding code => default severity,
# and each level may demote checks to warnings (`demote:`) or demote whole
# sections (`demote_sections:`). `title_checks:` holds section-less checks
# (title-kind-mismatch). Headings carry `## ` directly and are emitted
# verbatim — nothing wraps them in `### ` anymore.
#
# Everything structural about an issue lives here: which sections each kind
# requires, the level invariants GitHub will not enforce, the per-check
# severities the gate enforces, and the human copy the form generator emits.
# The gh shim, the CI gate and the file-issue skill all read their semantics
# from this file through tools/issue-intake.
#
# `sections:` is declared in visual (heading) order. `sectionIds()` returns
# declaration order, so it doubles as the render order. Headings compare
# through SectionParser::normalise(), never literally.

version: 2

kinds: [kind:feature, kind:bugfix, kind:release, kind:chore]

# The five every kind carries. Do not add epistemic-matrix here: chore excludes it.
skeleton: [core-metadata, problem-statement, acceptance-criteria,
           source-grounding, impact-profile]

kind_sections:
  kind:feature:
    requires: [feature-scope, epistemic-matrix]
    optional: []
  kind:bugfix:
    requires: [dependency-matrix, artifacts, runtime-state, epistemic-matrix]
    optional: []
  kind:chore:
    requires: [affected-surface]
    optional: []
  kind:release:
    requires: [affected-surface, epistemic-matrix]
    optional: []

# Level invariants the shim and CI enforce (GitHub will not).
# `level:package` is the root of a package's tree: it names the package,
# carries no kind, and its body is generated (spec Revision 5, §A7).
levels:
  level:package:
    parent: forbidden
    kind: forbidden
    sections: exempt
    requires_package_label: true
    form: false
  level:epic:
    parent:
      required: true
      allowed_parent_levels: [level:package]
      exempt_if: no_single_package_label
    # D14: epics keep core, problem, acceptance (no Test: line) and impact.
    # feature-scope, epistemic-matrix and source-grounding are warnings.
    demote: [source-grounding-empty, scenario-no-test]
    demote_sections: [feature-scope, epistemic-matrix]
  level:story:
    parent:
      required: true
      allowed_parent_levels: [level:epic]
  level:task:
    parent:
      required: true
      allowed_parent_levels: [level:story]
    children: forbidden

sections:
  core-metadata:
    heading: "## 🏗️ Core Metadata & Alignment"
    label: "Core Metadata & Alignment"
    description: "Locates the work: package, spec version, PHP target, parent, related issues."
    placeholder: "Package / subsystem · Arazzo spec version · PHP 8.4 · Parent: #n · Related: #n"
    checks: { parent-mismatch: error }
  problem-statement:
    heading: "## 📝 Problem Statement & Intent"
    label: "Problem Statement & Intent"
    description: "Why this exists, in requirements."
    placeholder: "Observed vs expected (bugfix) or intent (feature), under 150 words, then R1..Rn."
    checks: { missing-requirement: error }
  feature-scope:
    heading: "## 🎯 Feature Scope & Prior Art"
    label: "Feature Scope & Prior Art"
    description: "Goals, non-goals, prior art and the proposed interface."
    placeholder: "Goals, non-goals, prior art, proposed interface."
    checks: { non-goals-missing: warning }
  dependency-matrix:
    heading: "## 📦 System Dependency Matrix"
    label: "System Dependency Matrix"
    description: "What this touches, upstream and downstream."
    placeholder: "Packages involved, upstream spec versions, runtime dependencies."
    checks: {}
  affected-surface:
    heading: "## 🛠️ Affected Surface & Rollback"
    label: "Affected Surface & Rollback"
    description: "Packages touched, the risk, and how to roll back."
    placeholder: "Packages touched, risk level, rollback plan."
    checks: { rollback-missing: error }
  artifacts:
    heading: "## 📄 Structural Artifacts & Raw Inputs"
    label: "Structural Artifacts & Raw Inputs"
    description: "The smallest document, request or fixture that shows the behaviour."
    placeholder: "Minimal Arazzo/OpenAPI document, request/response, stack trace, or exact command."
    checks: { artifact-block-missing: error }
  runtime-state:
    heading: "## 🌀 Runtime Execution State Context"
    label: "Runtime Execution State Context"
    description: "Where in the execution this happens."
    placeholder: "Workflow/step/action id, inputs, resolved expressions, environment."
    checks: {}
  acceptance-criteria:
    heading: "## 🧪 Acceptance Criteria & Behavioral Specification"
    label: "Acceptance Criteria & Behavioral Specification"
    description: "Scenarios, constraints and the nine-quality coverage table."
    placeholder: "S1 (R1, Reliable): title / Given … When … Then … / Test: ClassTest::it_does_x; C1 … Check: …; coverage table"
    checks:
      scenario-shape: error
      scenario-no-test: error
      requirement-uncovered: error
      quality-coverage-missing: error
      vague-then: error
      checklist-unverifiable: error
  source-grounding:
    heading: "## 🧬 Source Grounding & Code Location"
    label: "Source Grounding & Code Location"
    description: "Bare permalinks pinned to a commit SHA, one per claim, then Verified: YYYY-MM-DD."
    placeholder: "- claim\nhttps://github.com/<owner>/<repo>/blob/<40-hex>/<path>#L<a>-L<b>\nVerified: YYYY-MM-DD"
    checks:
      permalink-invalid: error
      permalink-not-bare: error
      permalink-unverifiable: warning
      source-grounding-empty: error
  impact-profile:
    heading: "## 🌍 Public Domains & Impact Profile"
    label: "Public Domains & Impact Profile"
    description: "Who is affected, and how badly."
    placeholder: "Public API impact, blast radius, severity."
    checks: { bc-line-missing: error }
  epistemic-matrix:
    heading: "## 📊 Epistemic Verification Matrix"
    label: "Epistemic Verification Matrix"
    description: "Verified ground-truths separated from inferred assumptions."
    placeholder: "Claim | Tier (T1–T4) | Evidence | Verification"
    checks: { tier-invalid: error }

# Section-less checks: title-kind-mismatch is validated against the issue
# title, not against any section body.
title_checks:
  title-kind-mismatch: error
