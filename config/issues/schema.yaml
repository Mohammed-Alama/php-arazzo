# Issue-intake schema — the single source of truth (spec D9).
#
# Everything structural about an issue lives here: which sections each kind
# requires, the level invariants GitHub will not enforce, and the human copy
# the form generator emits. The gh shim, the CI gate and the file-issue skill
# all read their semantics from this file through tools/issue-intake.
#
# `sections:` is declared in visual (heading) order. Rendering order is
# declaration order, so the decorative numerals in the headings stay
# decorative. The three per-kind variants of section 3 sit together.

version: 1

kinds: [bug, enhancement, chore]

# Present on every kind. Order here is the skeleton's own order; it is not
# the render order (see the note above).
skeleton: [core-metadata, problem-statement, acceptance-criteria, source-grounding, impact-profile]

# Kind-specific sections, appended to the skeleton.
kind_sections:
  bug:
    requires: [dependency-matrix, artifacts, runtime-state, epistemic-matrix]
  enhancement:
    requires: [feature-scope, epistemic-matrix]
    optional: [source-grounding]
  chore:
    requires: [affected-surface]

# Level invariants the shim and CI enforce (GitHub will not).
levels:
  level:epic:
    parent: forbidden
  level:story:
    parent:
      required: true
      allowed_parent_levels: [level:epic]
  level:subtask:
    parent:
      required: true
      allowed_parent_levels: [level:story]
    children: forbidden

sections:
  core-metadata:
    heading: "🏗️ 1. Core Metadata & Alignment"
    label: "Core Metadata & Alignment"
    description: "Which component, which versions, which ecosystem."
    placeholder: "Component / subsystem, Arazzo spec version, PHP target, framework ecosystem."
  problem-statement:
    heading: "📝 2. Problem Statement & Intent"
    label: "Problem Statement & Intent"
    description: "What is wrong (or wanted), and why it matters."
    placeholder: "Observed vs. expected behaviour, or the intent behind the request."
  dependency-matrix:
    heading: "📦 3. System Dependency Matrix"
    label: "System Dependency Matrix"
    description: "What this touches, upstream and downstream."
    placeholder: "Packages involved, upstream spec versions, runtime dependencies."
  feature-scope:
    heading: "🎯 3. Feature Scope & Prior Art"
    label: "Feature Scope & Prior Art"
    description: "Goals, non-goals, prior art and the proposed interface."
    placeholder: "Goals, non-goals, prior art, proposed interface."
  affected-surface:
    heading: "🛠️ 3. Affected Surface & Rollback"
    label: "Affected Surface & Rollback"
    description: "Packages touched, the risk, and how to roll back."
    placeholder: "Packages touched, risk level, rollback plan."
  artifacts:
    heading: "📄 4. Structural Artifacts & Raw Inputs"
    label: "Structural Artifacts & Raw Inputs"
    description: "The smallest document, request or fixture that shows the behaviour."
    placeholder: "Minimal Arazzo/OpenAPI document, request/response, stack trace, or exact command."
  runtime-state:
    heading: "🌀 5. Runtime Execution State Context"
    label: "Runtime Execution State Context"
    description: "Where in the execution this happens."
    placeholder: "Workflow/step/action id, inputs, resolved expressions, environment."
  acceptance-criteria:
    heading: "🧪 6. Acceptance Criteria & Behavioral Specification"
    label: "Acceptance Criteria & Behavioral Specification"
    description: "How we will know it is done."
    placeholder: "- [ ] Given … when … then …"
  source-grounding:
    heading: "🧬 7. Source Grounding & Code Location"
    label: "Source Grounding & Code Location"
    description: "The exact code, commit and evidence behind the claim."
    placeholder: "file:line references, commit SHA, command output."
  impact-profile:
    heading: "🌍 8. Public Domains & Impact Profile"
    label: "Public Domains & Impact Profile"
    description: "Who is affected, and how badly."
    placeholder: "Public API impact, blast radius, severity."
  epistemic-matrix:
    heading: "📊 9. Epistemic Verification Matrix"
    label: "Epistemic Verification Matrix"
    description: "Verified ground-truths separated from inferred assumptions."
    placeholder: "Claim | Tier (T1–T4) | Evidence | Verification"
