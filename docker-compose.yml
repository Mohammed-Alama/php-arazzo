services:
  php:
    build: .
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      - redis
    environment:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
    stdin_open: true
    tty: true

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}"
