# docs/issues/drafts/pairs.yaml — story → task pairing manifest
#
# Phase 2 of the issue-format-v2 conversion runbook. PARTITION RULE:
# every draft 01–62 appears exactly once, either as a unit's `story`, as one
# of the unit's `tasks`, or under `superseded` naming the unit that replaces
# it. Validate with:
#   php tools/issue-intake/bin/issue-inventory --dir=docs/issues/drafts  (no)
#   see the partition check in the SDD report for this task
#
# Observed structure of the draft set:
#   * 01–11, 21–26, 28, 34–36 are standalone stories.
#   * 27, 29, 30, 31, 32, 33, 37 are core stories with a CLI task
#     (38, 39, 40, 41, 42, 43, 44 respectively).
#   * 45–53 are core stories with a CLI task (54–62 respectively).
#   * 12–20 are the older combined drafts that the 45–53 / 54–62 split
#     replaced. Each one explicitly references its replacement core draft
#     (12→45, 13→46, 14→47, 15→48, 16→49, 17→50, 18→51, 19→52, 20→53).
#     They are recorded as superseded, never filed.
#
# `parent` is the epic a story files under (a task's parent is always its
# story). Draft 31/41 suggested #85, which is `level:story`, not an epic, so
# they are re-parented to #137 (Runner execution semantics).

