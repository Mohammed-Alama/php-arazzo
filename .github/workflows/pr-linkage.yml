name: PR linkage

# The soft backstop for story #213. The gh shim hard-blocks an unlinked PR
# locally; this gate catches the web UI, `gh api` and any hand-cut branch.
# It only measures — never edits, labels or closes.
#
# Mark it a required status check once it has run green on a few PRs.

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

concurrency:
  group: pr-linkage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  linkage:
    name: Closes an issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Require a linked issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: bash .github/scripts/pr-linkage-gate.sh
