name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**.php'
      - '.github/workflows/ci.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - 'packages/*/composer.json'
      - 'phpstan.neon.dist'
      - '**/phpstan.neon.dist'
      - '**/phpstan-baseline.neon'
      - 'pint.json'
      - 'phpmd.xml'
      - 'phpmd.baseline.xml'
      - 'phpdoc.dist.xml'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/ci.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - 'packages/*/composer.json'
      - 'phpstan.neon.dist'
      - '**/phpstan.neon.dist'
      - '**/phpstan-baseline.neon'
      - 'pint.json'
      - 'phpmd.xml'
      - 'phpmd.baseline.xml'
      - 'phpdoc.dist.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Composer's download cache is kept inside the workspace so the cache step and
# composer agree on one directory, instead of trusting a platform default.
env:
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/.cache/composer

jobs:
  style:
    name: Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Check PHP code style
        uses: aglipanci/laravel-pint-action@2.6
        with:
          testMode: true

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # Rotate the php8.4 literal in the key when php-version above changes.
      - name: Cache composer downloads and vendor
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/composer
            vendor
          key: vendor-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock', 'composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-php8.4-
      - name: Install composer dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: |
          composer install --no-progress --prefer-dist --no-interaction
      - name: Run PHPStan
        run: composer run analyse
      - name: Check baseline policy
        run: composer run check-baselines

  phpmd:
    name: PHP Mess Detector
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      # Rotate the php8.4 literal in the key when php-version above changes.
      - name: Cache composer downloads and vendor
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/composer
            vendor
          key: vendor-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock', 'composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-php8.4-
      - name: Install composer dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: |
          composer install --no-progress --prefer-dist --no-interaction
      - name: Run PHPMD
        run: |
          vendor/bin/phpmd \
            packages/core/src,packages/contracts/src,packages/document/src,packages/expression/src,packages/runner/src,packages/cli/src,packages/laravel/src \
            github phpmd.xml \
            --baseline-file phpmd.baseline.xml \
            --ignore-violations-on-exit \
            --ignore-errors-on-exit

  phpdoc:
    name: phpDocumentor (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, intl, iconv, simplexml, xml
          coverage: none
      # Rotate the php8.4 literal in the key when php-version above changes.
      - name: Cache composer downloads and vendor
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/composer
            vendor
          key: vendor-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock', 'composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-php8.4-
      - name: Install composer dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: |
          composer install --no-progress --prefer-dist --no-interaction
      - name: Generate API docs (smoke check)
        run: vendor/bin/phpdoc run

  test:
    name: Test P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: ['8.4']
        laravel: ['13.*']
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
      - name: Cache composer downloads
        uses: actions/cache@v6
        with:
          path: .cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install dependencies
        run: |
          composer update --no-progress --${{ matrix.stability }} --prefer-dist --no-interaction
          cd packages/laravel
          composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --no-progress --${{ matrix.stability }} --prefer-dist --no-interaction
          cd ../..
      - name: Execute tests
        run: composer run test
