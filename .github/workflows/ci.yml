name: CI

on:
  push:
    branches:
      - main
    paths:
      - '**.php'
      - '.github/workflows/ci.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - 'packages/*/composer.json'
      - 'phpstan.neon.dist'
      - '**/phpstan.neon.dist'
      - '**/phpstan-baseline.neon'
      - 'pint.json'
      - 'phpmd.xml'
      - 'phpmd.baseline.xml'
      - 'phpdoc.dist.xml'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/ci.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
      - 'packages/*/composer.json'
      - 'phpstan.neon.dist'
      - '**/phpstan.neon.dist'
      - '**/phpstan-baseline.neon'
      - 'pint.json'
      - 'phpmd.xml'
      - 'phpmd.baseline.xml'
      - 'phpdoc.dist.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Composer's download cache is kept inside the workspace so the cache step and
# composer agree on one directory, instead of trusting a platform default.
env:
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/.cache/composer
  # The one place CI states its PHP version. The three jobs that cache vendor/
  # both pin from it and key from it, so a bump cannot leave behind a vendor
  # tree built by the previous interpreter (#249).
  PHP_VERSION: '8.4'

jobs:
  style:
    name: Code Style
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Check PHP code style
        uses: aglipanci/laravel-pint-action@2.6
        with:
          testMode: true

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - name: Cache composer downloads and vendor
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/composer
            vendor
          key: vendor-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-php${{ env.PHP_VERSION }}-
      - name: Install composer dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: |
          composer install --no-progress --prefer-dist --no-interaction
      - name: Run PHPStan
        run: composer run analyse
      - name: Check baseline policy
        run: composer run check-baselines
      # This job installs from the lock and rewrites nothing, unlike the test
      # matrix, which swaps a package manifest to change Laravel version.
      - name: Check the lock still describes the package manifests
        run: composer run check-lock-manifests

  phpmd:
    name: PHP Mess Detector
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - name: Cache composer downloads and vendor
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/composer
            vendor
          key: vendor-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-php${{ env.PHP_VERSION }}-
      - name: Install composer dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: |
          composer install --no-progress --prefer-dist --no-interaction
      - name: Run PHPMD
        run: |
          # `phpmd analyze` takes the paths as separate arguments; the old
          # comma-joined form only worked because the deprecated positional
          # syntax split on commas, and is now silently wrong.
          #
          # Every package with a src/ directory, matching the Makefile's
          # PHPMD_PATHS (#242). tests/scripts/PhpmdGateWiringTest.php fails
          # if the two lists drift apart or if a package is left out.
          vendor/bin/phpmd analyze \
            packages/core/src packages/contracts/src packages/document/src \
            packages/expression/src packages/evaluation/src packages/sources/src \
            packages/runtime/src packages/engine/src packages/events/src \
            packages/runner/src packages/cli/src packages/laravel/src \
            packages/protocol-http/src packages/protocol-rpc/src packages/protocol-soap/src \
            --format github \
            --ruleset phpmd.xml \
            --baseline-file phpmd.baseline.xml \
            --threads 1
          # Deliberately neither --ignore-errors-on-exit nor
          # --ignore-violations-on-exit. PDepend 3 parses PHP 8.4, so a parse
          # failure now fails the job instead of being annotated and swallowed,
          # and phpmd.baseline.xml is the single place a known violation is
          # accepted.
          #
          # --threads 1 for the same reason: multi-threaded, a parse failure
          # aborts through a worker-protocol panic that names no file, and a
          # regeneration can write a half-finished baseline. Single-threaded it
          # is a clean exit 3 that says which file it could not read.
          #
          # Known upstream gap, so nobody assumes coverage: PDepend parses PHP
          # 8.4 property hooks but PHPMD applies no rules to hook bodies, so a
          # violation inside a `get`/`set` hook is invisible here. Tracked by
          # #244.

  phpdoc:
    name: phpDocumentor (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, intl, iconv, simplexml, xml
          coverage: none
      - name: Cache composer downloads and vendor
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/composer
            vendor
          key: vendor-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock', 'composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-php${{ env.PHP_VERSION }}-
      - name: Install composer dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: |
          composer install --no-progress --prefer-dist --no-interaction
      - name: Generate API docs (smoke check)
        run: vendor/bin/phpdoc run

  test:
    name: Test P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: ['8.4']
        laravel: ['13.*']
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none
      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
      - name: Cache composer downloads
        uses: actions/cache@v6
        with:
          path: .cache/composer
          key: composer-${{ runner.os }}-${{ hashFiles('composer.json', 'packages/*/composer.json') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install dependencies
        run: |
          composer update --no-progress --${{ matrix.stability }} --prefer-dist --no-interaction
          cd packages/laravel
          composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --no-progress --${{ matrix.stability }} --prefer-dist --no-interaction
          cd ../..
      - name: Execute tests
        run: composer run test
