name: Package index

# The living index (spec A7). Separate from the intake gate because it reads
# children and writes a body, where the gate reads a body and writes a label.
#
# Triggers are deliberately narrow: the index only changes when the *set* of a
# package's children changes or a child's state flips, so we listen to the
# structural events (`opened`, `closed`, `reopened`, `transferred`) and leave
# body/label churn (`edited`, `labeled`, `unlabeled`) out — those fired a heavy
# job on every triage edit for no index change. The schedule is not optional:
# the `issues` event set does not reliably cover parent-link changes or title
# edits, so the sweep is how the index stays true. The concurrency group is
# prefixed to stay clear of issue-intake's.

on:
  issues:
    types: [opened, closed, reopened, transferred]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Package-epic (or a child) to re-index; omit to sweep
        required: false
        type: number
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: package-index-${{ github.event.issue.number || inputs.issue_number || 'sweep' }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

# Composer's download cache is kept inside the workspace so the cache step and
# composer agree on one directory, instead of trusting a platform default.
env:
  COMPOSER_CACHE_DIR: ${{ github.workspace }}/.cache/composer

jobs:
  index:
    name: Regenerate the package index
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Rotate the php8.4 literal in the key when php-version above changes.
      - name: Cache composer downloads and vendor
        id: composer-cache
        uses: actions/cache@v6
        with:
          path: |
            .cache/composer
            vendor
          key: vendor-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock', 'composer.json', 'packages/*/composer.json') }}
          restore-keys: vendor-${{ runner.os }}-php8.4-

      - name: Install dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Re-index
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number || '' }}
        run: bash .github/scripts/package-index.sh