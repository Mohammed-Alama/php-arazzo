name: Ecosystem Feed

on:
  schedule:
    - cron: '17 6 * * *'  # daily 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      source:
        description: 'Filter to source id (optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: ecosystem-feed
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: .cache/ecosystem
          key: ecosystem-etags-${{ hashFiles('config/ecosystem/sources.json') }}
          restore-keys: ecosystem-etags-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, dom, libxml, json

      - name: Poll ecosystem feed (via gh cli)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh --version
          gh auth status || echo "gh not authenticated, falling back to curl (GITHUB_TOKEN still used for curl fallback)"
          ARGS="--commit"
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then ARGS="--dry-run"; fi
          if [[ -n "${{ inputs.source }}" ]]; then ARGS="$ARGS --source=${{ inputs.source }}"; fi
          php scripts/ecosystem/poll.php $ARGS --verbose 2>&1 | tee /tmp/ecosystem.log
          cat /tmp/ecosystem.log

      - name: Commit state if changed
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # State (watermarks + entities + monthly events) must be committed; raw payload snapshots are not.
          # No `|| true`: a failed add (e.g. an ignored state path) must fail the job.
          git add storage/ecosystem-feed/state docs/ECOSYSTEM_FEED.md config/ecosystem/sources.oai.json
          if ! git ls-files --error-unmatch storage/ecosystem-feed/state/watermarks.json >/dev/null 2>&1; then
            echo "::error::storage/ecosystem-feed/state/watermarks.json is not tracked by git — state would be lost."
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No ecosystem state changes."
          else
            git commit -m "chore(ecosystem): update feed $(date -u +%Y-%m-%d)"
            for attempt in 1 2; do
              git pull --rebase origin main
              if git push; then
                echo "Pushed on attempt ${attempt}."
                break
              fi
              if [[ "${attempt}" == "2" ]]; then
                echo "::error::git push failed after retry."
                exit 1
              fi
              echo "Push rejected (likely a concurrent bot commit); retrying after rebase."
            done
          fi
