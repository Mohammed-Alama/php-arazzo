name: Ecosystem Feed

on:
  schedule:
    - cron: '17 6 * * *'  # daily 06:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commit)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      source:
        description: 'Filter to source id (optional)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: ecosystem-feed
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/cache@v6
        with:
          path: .cache/ecosystem
          key: ecosystem-etags-${{ hashFiles('config/ecosystem/sources.json') }}
          restore-keys: ecosystem-etags-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          extensions: curl, dom, libxml, json

      - name: Poll ecosystem feed (via gh cli)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh --version
          gh auth status || echo "gh not authenticated, falling back to curl (GITHUB_TOKEN still used for curl fallback)"
          ARGS="--commit"
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then ARGS="--dry-run"; fi
          if [[ -n "${{ inputs.source }}" ]]; then ARGS="$ARGS --source=${{ inputs.source }}"; fi
          php scripts/ecosystem/poll.php $ARGS --verbose 2>&1 | tee /tmp/ecosystem.log
          cat /tmp/ecosystem.log

      - name: Prune snapshots older than 30d
        if: inputs.dry_run != 'true'
        run: |
          php -r '
            $dir="storage/ecosystem-feed/snapshots";
            if (!is_dir($dir)) exit(0);
            $cut=strtotime("-30 days");
            foreach (new RecursiveIteratorIterator(new RecursiveDirectoryIterator($dir, FilesystemIterator::SKIP_DOTS)) as $f) {
              if ($f->isFile() && $f->getMTime() < $cut) { unlink($f->getPathname()); }
            }
            foreach (glob($dir."/*") as $d) { if (is_dir($d) && count(glob($d."/*"))===0) rmdir($d); }
          '

      - name: Commit feed if changed
        if: inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage/ecosystem-feed/feed.json storage/ecosystem-feed/snapshots docs/ECOSYSTEM_FEED.md docs/generated/ecosystem-feed.json config/ecosystem/sources.oai.json || true
          if git diff --cached --quiet; then
            echo "No feed changes."
          else
            git commit -m "chore(ecosystem): update feed $(date -u +%Y-%m-%d)"
            git push
          fi
