name: 'Bug fix'
description: 'Report something that is broken or behaves incorrectly.'
title: 'fix(<package>): '
labels:
  - 'kind:bugfix'
body:
  -
    type: dropdown
    id: level
    attributes:
      label: Level
      description: 'Where this sits in the hierarchy: Epic → Story → Task.'
      options:
        - 'level:epic'
        - 'level:story'
        - 'level:task'
    validations:
      required: true
  -
    type: textarea
    id: core-metadata
    attributes:
      label: 'Core Metadata & Alignment'
      description: 'Locates the work: package, spec version, PHP target, parent, related issues.'
      placeholder: 'Package / subsystem · Arazzo spec version · PHP 8.4 · Parent: #n · Related: #n'
    validations:
      required: true
  -
    type: textarea
    id: problem-statement
    attributes:
      label: 'Problem Statement & Intent'
      description: 'Why this exists, in requirements.'
      placeholder: 'Observed vs expected (bugfix) or intent (feature), under 150 words, then R1..Rn.'
    validations:
      required: true
  -
    type: textarea
    id: dependency-matrix
    attributes:
      label: 'System Dependency Matrix'
      description: 'What this touches, upstream and downstream.'
      placeholder: 'Packages involved, upstream spec versions, runtime dependencies.'
    validations:
      required: true
  -
    type: textarea
    id: artifacts
    attributes:
      label: 'Structural Artifacts & Raw Inputs'
      description: 'The smallest document, request or fixture that shows the behaviour.'
      placeholder: 'Minimal Arazzo/OpenAPI document, request/response, stack trace, or exact command.'
    validations:
      required: true
  -
    type: textarea
    id: runtime-state
    attributes:
      label: 'Runtime Execution State Context'
      description: 'Where in the execution this happens.'
      placeholder: 'Workflow/step/action id, inputs, resolved expressions, environment.'
    validations:
      required: true
  -
    type: textarea
    id: acceptance-criteria
    attributes:
      label: 'Acceptance Criteria & Behavioral Specification'
      description: 'Scenarios, constraints and the nine-quality coverage table.'
      placeholder: 'S1 (R1, Reliable): title / Given … When … Then … / Test: ClassTest::it_does_x; C1 … Check: …; coverage table'
    validations:
      required: true
  -
    type: textarea
    id: source-grounding
    attributes:
      label: 'Source Grounding & Code Location'
      description: 'Bare permalinks pinned to a commit SHA, one per claim, then Verified: YYYY-MM-DD.'
      placeholder: "- claim\nhttps://github.com/<owner>/<repo>/blob/<40-hex>/<path>#L<a>-L<b>\nVerified: YYYY-MM-DD"
    validations:
      required: true
  -
    type: textarea
    id: impact-profile
    attributes:
      label: 'Public Domains & Impact Profile'
      description: 'Who is affected, and how badly.'
      placeholder: 'Public API impact, blast radius, severity.'
    validations:
      required: true
  -
    type: textarea
    id: epistemic-matrix
    attributes:
      label: 'Epistemic Verification Matrix'
      description: 'Verified ground-truths separated from inferred assumptions.'
      placeholder: 'Claim | Tier (T1–T4) | Evidence | Verification'
    validations:
      required: true
